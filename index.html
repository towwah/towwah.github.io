<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOWWAH | تَوّه</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#e9e2d2;
  color:#171713;
  overflow-x:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

/* PAPER TEXTURE */

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:999;
  opacity:.14;
  background-image:
  radial-gradient(#333 0.45px, transparent 0.45px);
  background-size:6px 6px;
  mix-blend-mode:multiply;
}

:root{
  --paper:#eee7d8;
  --paper2:#e4ddcc;
  --ink:#171713;
  --blue:#314b78;
  --olive:#68705a;
  --wine:#4c1820;
  --line:#9b927e;
}

/* HERO */

.hero{
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:var(--paper);
  border-bottom:1px solid #8f8778;
}

.topline{
  padding:18px 28px;
  border-bottom:1px solid #8f8778;
  display:flex;
  justify-content:space-between;
  font-size:11px;
  letter-spacing:.17em;
  text-transform:uppercase;
}

.marquee{
  width:100%;
  overflow:hidden;
  white-space:nowrap;
}

.track{
  display:inline-flex;
  width:max-content;
  animation:scrollLeft 23s linear infinite;
}

.track.ar{
  animation:scrollRight 28s linear infinite;
}

.word{
  font-family:Georgia,serif;
  font-size:clamp(95px,15vw,230px);
  line-height:.78;
  letter-spacing:-.07em;
  padding:38px 30px;
}

.word.arabic{
  font-family:"Times New Roman",serif;
  direction:rtl;
  letter-spacing:0;
}

@keyframes scrollLeft{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

@keyframes scrollRight{
  from{transform:translateX(-50%)}
  to{transform:translateX(0)}
}

/* COLLAGE */

.hero-collage{
  position:relative;
  height:500px;
  max-width:1300px;
  margin:auto;
}

.paper-card{
  position:absolute;
  background:#f0e8d7;
  border:1px solid #aaa08d;
  box-shadow:0 13px 25px rgba(0,0,0,.14);
}

.postcard{
  width:400px;
  height:240px;
  left:10%;
  top:80px;
  padding:25px;
  transform:rotate(-4deg);
}

.postcard-title{
  font-family:Georgia,serif;
  font-size:32px;
  margin-bottom:25px;
}

.postcard small{
  display:block;
  font-size:10px;
  letter-spacing:.13em;
  margin-bottom:12px;
}

.postcard-line{
  border-bottom:1px solid #8e8575;
  margin:18px 0;
}

.photo-card{
  width:320px;
  height:350px;
  right:12%;
  top:25px;
  transform:rotate(5deg);
  padding:12px;
}

.fake-photo{
  width:100%;
  height:275px;
  background:
  linear-gradient(
    rgba(25,25,20,.12),
    rgba(25,25,20,.12)
  ),
  #b6ab96;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Georgia,serif;
  font-size:26px;
}

.photo-caption{
  font-size:10px;
  margin-top:12px;
  letter-spacing:.1em;
}

  left:43%;
  top:225px;
  transform:rotate(-7deg);
}
